---
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Check JavaScript syntax
        run: |
          node --check index.js
          node --check post.js

      - name: Validate action.yml
        run: |
          node -e "
            const fs = require('fs');
            const yaml = fs.readFileSync('action.yml', 'utf8');
            if (!yaml.includes('name:')) throw new Error('action.yml missing name');
            if (!yaml.includes('description:')) throw new Error('action.yml missing description');
            if (!yaml.includes('runs:')) throw new Error('action.yml missing runs');
            console.log('action.yml structure OK');
          "

      - name: Ensure no node_modules checked in
        run: |
          if [ -d node_modules ]; then
            echo "::error::node_modules directory should not be committed"
            exit 1
          fi

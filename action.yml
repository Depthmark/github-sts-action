name: 'GitHub STS Provider'
description: |
  Exchange the workflow's OIDC identity token for a scoped GitHub App.

inputs:
  sts-url:
    description: |
      The base URL of the github-sts instance (e.g. https://github-sts.example.com).
    required: true

  scope:
    description: |
      The org/repo to which to request access (e.g. my-org/my-repo).
    required: true

  identity:
    description: |
      The name of the trust policy to evaluate. The policy is loaded from
      .github/sts/{app}/{identity}.sts.yaml in the target repository.
    required: true

  app:
    description: |
      GitHub App name configured on the STS server. Optional if only one app
      is configured on the server.
    required: false

  audience:
    description: |
      OIDC audience to request when fetching the identity token.
    default: 'github-sts'

  github-api-url:
    description: |
      GitHub API base URL. Override for GitHub Enterprise Server
      (e.g. https://github.example.com/api/v3).
    default: 'https://api.github.com'

outputs:
  token:
    description: |
      The scoped GitHub installation token. Empty if the exchange failed.

  error-code:
    description: |
      Set only when the exchange fails (empty on success). Either the exact
      machine-readable `code` returned by the STS server's
      {"error","code","trace_id"} response body (e.g. `policy_denied`,
      `upstream_error` — see your github-sts instance's API reference for
      the full server-side list), or one of this action's own `action_`-
      prefixed codes for failures that never reach the server:
      `action_invalid_input`, `action_missing_oidc_env`,
      `action_oidc_fetch_failed`, `action_connection_failed`,
      `action_invalid_response`, `action_malformed_error_response`,
      `action_internal_error`. Use this instead of parsing the log or job
      summary to branch on failure reason (with `continue-on-error: true`
      on this step).

  error-message:
    description: |
      Set only when the exchange fails. Human-readable description of
      error-code; the same text written to the step's ::error:: annotation.

  http-status:
    description: |
      Set only when the exchange fails and a response was actually received
      from the STS server (empty for input-validation, OIDC, and connection
      failures, which never reach it).

branding:
  icon: 'shield'
  color: 'blue'

runs:
  using: 'node24'
  main: 'index.js'
  post: 'post.js'
